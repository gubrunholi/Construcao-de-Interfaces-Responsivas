<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HABIT – Assine a newsletter e receba conteúdos exclusivos." />
  <title>HABIT – Assine a newsletter</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .form-page-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: var(--space-xl) 0;
    }

    .form-card {
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-xl);
      width: 100%;
      max-width: 420px;
    }

    .form-card h1 {
      font-family: var(--font-display);
      font-size: var(--text-h2);
      color: var(--color-text);
      margin-bottom: var(--space-lg);
    }

    @media (max-width: 480px) {
      .form-card { padding: var(--space-md); }
      .form-card h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="site-logo" href="index.html" aria-label="HABIT – Página inicial">HABIT</a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="listagem.html">Páginas</a>
        <a href="destaques.html">Destaques</a>
        <a href="assinar.html" aria-current="page">Assinar</a>
        <a href="admin-categorias.html" class="nav-admin">Admin</a>
      </nav>
      <div class="header-search">
        <label for="search-assinar" class="sr-only">Buscar</label>
        <input class="search-input" type="search" id="search-assinar" placeholder="Buscar..." />
        <a href="busca.html" class="btn btn-outline btn-sm">Buscar</a>
        <a href="entrar.html" class="btn btn-ghost btn-sm">Entrar</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="page-wrapper">
    <div class="form-page-wrap">
      <div class="form-card">
        <h1>Assine a newsletter</h1>

        <div class="form-group">
          <label class="form-label" for="email-newsletter">E-mail</label>
          <input
            class="form-input"
            type="email"
            id="email-newsletter"
            name="email"
            placeholder="E-mail"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-checkbox-row">
          <input type="checkbox" id="privacy-check" name="privacy" required />
          <label for="privacy-check">
            Concordo em receber comunicações e li a política de privacidade.
          </label>
        </div>

        <button class="btn btn-primary" type="submit">Assinar</button>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <nav class="footer-links" aria-label="Links do rodapé">
      <a href="#">Instagram</a><a href="#">Work</a><a href="#">Bags</a><a href="#">Lamp</a><a href="#">Books</a>
    </nav>
    <p class="footer-copy">© 2025 Meu Site • <a href="#">Meu site</a></p>
  </footer>

  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
</body>
</html>
