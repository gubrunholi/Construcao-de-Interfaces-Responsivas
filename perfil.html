<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HABIT – Perfil do usuário e suas postagens." />
  <title>HABIT – Perfil</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .profile-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: var(--space-lg);
      align-items: start;
    }

    /* Sidebar do perfil */
    .profile-sidebar {
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
    }

    .profile-sidebar h2 {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: var(--space-md);
    }

    .profile-avatar {
      background: var(--color-placeholder);
      border-radius: var(--radius-md);
      width: 100%;
      height: 140px;
      margin-bottom: var(--space-md);
    }

    /* Postagens */
    .profile-posts {
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-lg);
    }

    .profile-posts h1 {
      font-family: var(--font-display);
      font-size: var(--text-h2);
      margin-bottom: var(--space-lg);
    }

    .user-post-card {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
      background: var(--color-bg-white);
      transition: box-shadow 0.15s;
    }

    .user-post-card:last-child { margin-bottom: 0; }
    .user-post-card:hover { box-shadow: var(--shadow-sm); }

    .user-post-info { flex: 1; }

    .user-post-status {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-bottom: var(--space-xs);
    }

    .user-post-title {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--color-text);
    }

    @media (max-width: 767px) {
      .profile-layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .profile-posts h1 { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="site-logo" href="index.html" aria-label="HABIT – Página inicial">HABIT</a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="listagem.html">Páginas</a>
        <a href="destaques.html">Destaques</a>
        <a href="assinar.html">Assinar</a>
        <a href="admin-categorias.html" class="nav-admin">Admin</a>
      </nav>
      <div class="header-search">
        <label for="search-perfil" class="sr-only">Buscar</label>
        <input class="search-input" type="search" id="search-perfil" placeholder="Buscar..." />
        <a href="busca.html" class="btn btn-outline btn-sm">Buscar</a>
        <a href="entrar.html" class="btn btn-ghost btn-sm">Entrar</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="page-wrapper">
    <div class="profile-layout">

      <!-- Sidebar do perfil -->
      <aside aria-label="Dados do perfil">
        <div class="profile-sidebar">
          <h2>Perfil</h2>
          <div class="profile-avatar" role="img" aria-label="Foto de perfil do usuário"></div>

          <div class="form-group">
            <label class="form-label" for="perfil-nome">Nome</label>
            <input class="form-input" type="text" id="perfil-nome" name="name" placeholder="Nome" autocomplete="name" />
          </div>

          <div class="form-group">
            <label class="form-label" for="perfil-bio">Bio</label>
            <input class="form-input" type="text" id="perfil-bio" name="bio" placeholder="Bio" />
          </div>

          <button class="btn btn-primary" type="button">Salvar</button>
        </div>
      </aside>

      <!-- Postagens do usuário -->
      <section aria-labelledby="suas-postagens">
        <div class="profile-posts">
          <h1 id="suas-postagens">Suas Postagens</h1>

          <article class="user-post-card">
            <div class="img-placeholder-sq" role="img" aria-label="Imagem do post"></div>
            <div class="user-post-info">
              <p class="user-post-status">Rascunho</p>
              <h2 class="user-post-title"><a href="#">Post 1</a></h2>
            </div>
          </article>

          <article class="user-post-card">
            <div class="img-placeholder-sq" role="img" aria-label="Imagem do post"></div>
            <div class="user-post-info">
              <p class="user-post-status">Publicado</p>
              <h2 class="user-post-title"><a href="#">Post 2</a></h2>
            </div>
          </article>

          <article class="user-post-card">
            <div class="img-placeholder-sq" role="img" aria-label="Imagem do comentário"></div>
            <div class="user-post-info">
              <p class="user-post-status">Em análise</p>
              <h2 class="user-post-title"><a href="#">Comentário 1</a></h2>
            </div>
          </article>

          <article class="user-post-card">
            <div class="img-placeholder-sq" role="img" aria-label="Imagem do comentário"></div>
            <div class="user-post-info">
              <p class="user-post-status">Publicado</p>
              <h2 class="user-post-title"><a href="#">Comentário 2</a></h2>
            </div>
          </article>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <nav class="footer-links" aria-label="Links do rodapé">
      <a href="#">Instagram</a><a href="#">Work</a><a href="#">Bags</a><a href="#">Lamp</a><a href="#">Books</a>
    </nav>
    <p class="footer-copy">© 2025 Meu Site • <a href="#">Meu site</a></p>
  </footer>

  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
</body>
</html>
