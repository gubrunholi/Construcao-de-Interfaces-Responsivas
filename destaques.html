<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HABIT – Postagens em destaque." />
  <title>HABIT – Destaques</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .page-title {
      font-family: var(--font-display);
      font-size: var(--text-h1);
      color: var(--color-text);
      margin-bottom: var(--space-xl);
    }

    .destaques-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-md);
    }

    .destaque-card {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--color-bg-white);
      transition: box-shadow 0.2s, transform 0.2s;
      width: 250px;
    }

    .destaque-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .destaque-card:focus-within { outline: 2px solid var(--color-primary); }

    .destaque-img {
      background: var(--color-placeholder);
      width: 100%;
      aspect-ratio: 4/3;
    }

    .destaque-body {
      padding: var(--space-md);
    }

    .destaque-title {
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--color-text);
    }

    .destaque-title a:hover { color: var(--color-primary); }
    .destaque-title a:focus { outline: 2px solid var(--color-primary); border-radius: 2px; }

    @media (max-width: 480px) {
      .destaques-grid { grid-template-columns: 1fr; }
      .page-title { font-size: 1.6rem; }
    }

    @media (min-width: 481px) and (max-width: 767px) {
      .destaques-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 768px) {
      .destaques-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
