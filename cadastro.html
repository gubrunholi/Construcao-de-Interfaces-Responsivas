<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HABIT – Criar uma nova conta." />
  <title>HABIT – Criar Conta</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .auth-wrap {
      display: flex;
      justify-content: center;
      padding: var(--space-xl) 0;
    }

    .auth-card {
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-xl);
      width: 100%;
      max-width: 420px;
    }

    .auth-card h1 {
      font-family: var(--font-display);
      font-size: var(--text-h2);
      color: var(--color-text);
      margin-bottom: var(--space-lg);
    }

    @media (max-width: 480px) {
      .auth-card { padding: var(--space-md); }
      .auth-card h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="site-logo" href="index.html" aria-label="HABIT – Página inicial">HABIT</a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="listagem.html">Páginas</a>
        <a href="destaques.html">Destaques</a>
        <a href="assinar.html">Assinar</a>
        <a href="admin-categorias.html" class="nav-admin">Admin</a>
      </nav>
      <div class="header-search">
        <label for="search-cad" class="sr-only">Buscar</label>
        <input class="search-input" type="search" id="search-cad" placeholder="Buscar..." />
        <a href="busca.html" class="btn btn-outline btn-sm">Buscar</a>
        <a href="entrar.html" class="btn btn-ghost btn-sm">Entrar</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="page-wrapper">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Criar Conta</h1>

        <div class="form-group">
          <label class="form-label" for="cad-nome">Nome completo</label>
          <input class="form-input" type="text" id="cad-nome" name="name" placeholder="Nome completo" required autocomplete="name" />
        </div>

        <div class="form-group">
          <label class="form-label" for="cad-email">E-mail</label>
          <input class="form-input" type="email" id="cad-email" name="email" placeholder="E-mail" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="cad-senha">Senha</label>
          <input class="form-input" type="password" id="cad-senha" name="password" placeholder="Senha" required autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label class="form-label" for="cad-confirma">Confirmar senha</label>
          <input class="form-input" type="password" id="cad-confirma" name="password_confirm" placeholder="Confirmar senha" required autocomplete="new-password" />
        </div>

        <div class="form-checkbox-row">
          <input type="checkbox" id="terms-check" name="terms" required />
          <label for="terms-check">
            Concordo com os termos e a <a href="#">política de privacidade</a>
          </label>
        </div>

        <button class="btn btn-primary" type="submit">Cadastrar</button>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <nav class="footer-links" aria-label="Links do rodapé">
      <a href="#">Instagram</a><a href="#">Work</a><a href="#">Bags</a><a href="#">Lamp</a><a href="#">Books</a>
    </nav>
    <p class="footer-copy">© 2025 Meu Site • <a href="#">Meu site</a></p>
  </footer>

  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
</body>
</html>
