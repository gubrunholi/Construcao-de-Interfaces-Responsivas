<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HABIT – Entre na sua conta." />
  <title>HABIT – Entrar</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .auth-wrap {
      display: flex;
      justify-content: center;
      padding: var(--space-xl) 0;
    }

    .auth-card {
      background: var(--color-bg-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-xl);
      width: 100%;
      max-width: 420px;
    }

    .auth-card h1 {
      font-family: var(--font-display);
      font-size: var(--text-h2);
      color: var(--color-text);
      margin-bottom: var(--space-lg);
    }

    .auth-actions {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-bottom: var(--space-md);
    }

    .auth-links {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    .auth-links a {
      color: var(--color-primary);
    }

    .auth-links a:hover { text-decoration: underline; }
    .auth-links a:focus { outline: 2px solid var(--color-primary); border-radius: 2px; }

    @media (max-width: 480px) {
      .auth-card { padding: var(--space-md); }
      .auth-card h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <header class="site-header" role="banner">
    <div class="header-inner">
      <a class="site-logo" href="index.html" aria-label="HABIT – Página inicial">HABIT</a>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="index.html">Início</a>
        <a href="listagem.html">Páginas</a>
        <a href="destaques.html">Destaques</a>
        <a href="assinar.html">Assinar</a>
        <a href="admin-categorias.html" class="nav-admin">Admin</a>
      </nav>
      <div class="header-search">
        <label for="search-entrar" class="sr-only">Buscar</label>
        <input class="search-input" type="search" id="search-entrar" placeholder="Buscar..." />
        <a href="busca.html" class="btn btn-outline btn-sm">Buscar</a>
        <a href="entrar.html" class="btn btn-ghost btn-sm" aria-current="page">Entrar</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="page-wrapper">
    <div class="auth-wrap">
      <div class="auth-card">
        <h1>Entrar</h1>

        <div class="form-group">
          <label class="form-label" for="login-email">E-mail</label>
          <input class="form-input" type="email" id="login-email" name="email" placeholder="E-mail" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label class="form-label" for="login-senha">Senha</label>
          <input class="form-input" type="password" id="login-senha" name="password" placeholder="Senha" required autocomplete="current-password" />
        </div>

        <div class="auth-actions">
          <button class="btn btn-primary" type="submit">Entrar</button>
          <a href="cadastro.html" class="btn btn-outline">Entrar com Google</a>
        </div>

        <p class="auth-links">
          <a href="#">Esqueci a senha</a> • <a href="cadastro.html">Criar conta</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <nav class="footer-links" aria-label="Links do rodapé">
      <a href="#">Instagram</a><a href="#">Work</a><a href="#">Bags</a><a href="#">Lamp</a><a href="#">Books</a>
    </nav>
    <p class="footer-copy">© 2025 Meu Site • <a href="#">Meu site</a></p>
  </footer>

  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
</body>
</html>
